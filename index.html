<!doctype html>
<html lang="de" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KUPFERHAUS
KINOKELLER</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&amp;family=Lato:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0609;--surf:#2c0b11;--red:#b3141f;--red2:#d92a35;--text:#f6e9d7;--mut:#cfae9f;--gold:#eab96b;--line:#5a2029;--on-red:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f7ecdc;--surf:#fff7ea;--red:#a8121c;--red2:#c4202b;--text:#3a0a10;--mut:#7d4c4c;--gold:#9a6408;--line:#e2c6b2;color-scheme:light}}
:root[data-theme="dark"]{--bg:#1c0609;--surf:#2c0b11;--red:#b3141f;--red2:#d92a35;--text:#f6e9d7;--mut:#cfae9f;--gold:#eab96b;--line:#5a2029;color-scheme:dark}
:root[data-theme="light"]{--bg:#f7ecdc;--surf:#fff7ea;--red:#a8121c;--red2:#c4202b;--text:#3a0a10;--mut:#7d4c4c;--gold:#9a6408;--line:#e2c6b2;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(ellipse at top,rgba(217,42,53,.22),transparent 60%) no-repeat;color:var(--text);font:17px/1.65 Lato,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.15;margin:0 0 .5em}
header{text-align:center;padding:28px 16px 8px}
.logo{font:800 clamp(2rem,7vw,3.4rem)/1 "Playfair Display",Georgia,serif;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.logo small{display:block;font:400 .8rem Lato,sans-serif;letter-spacing:.4em;color:var(--mut);margin-top:8px}
.bulbs{height:14px;margin:14px auto;max-width:640px;background:radial-gradient(circle,var(--gold) 3px,transparent 4px) 0 50%/24px 14px repeat-x;opacity:.85}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px 12px 18px}
nav a{color:var(--text);text-decoration:none;padding:9px 18px;border:1px solid var(--line);border-radius:99px;font-weight:700;font-size:.95rem}
nav a.on,nav a:hover{background:var(--red);border-color:var(--red);color:var(--on-red)}
main{max-width:860px;margin:0 auto;padding:0 18px 60px}
.page{display:none}.page.on{display:block}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}
.ticket{display:grid;grid-template-columns:200px 1fr;gap:24px;border:2px dashed var(--gold);background:var(--surf);border-radius:18px;padding:22px}
.poster{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(160deg,var(--red2),#4a0a12);display:grid;place-items:center;font-size:4rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tag{display:inline-block;background:var(--red);color:var(--on-red);padding:3px 12px;border-radius:99px;font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.meta{color:var(--gold);font-weight:700;margin:6px 0 12px}
.count{font:800 2.2rem "Playfair Display",serif;color:var(--red2)}
.btn{display:inline-block;background:var(--red);color:var(--on-red);border:0;border-radius:10px;padding:11px 22px;font:700 1rem Lato,sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--red2)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{color:var(--gold);letter-spacing:.25em;text-transform:uppercase;font-size:.8rem;font-weight:700;margin-bottom:6px}
.tl{border-left:2px solid var(--red);padding-left:22px;margin-left:6px}
.tl section{position:relative;margin-bottom:28px}
.tl section::before{content:"";position:absolute;left:-30px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid .card{margin:0}
input,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;margin:4px 0 12px}
label{font-weight:700;font-size:.9rem;color:var(--mut)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{margin:0}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow div{text-align:center;color:var(--mut);font-size:.78rem;font-weight:700;padding-bottom:4px}
.day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--text);font:700 .95rem Lato,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;overflow:hidden}
.day small{font-size:.58rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.past{opacity:.35;cursor:default}.day.empty{border:0;background:none;cursor:default}
.day.today{border-color:var(--gold)}
.day.sel{outline:2px solid var(--gold)}
.day.booked{background:var(--red);border-color:var(--red);color:var(--on-red);cursor:not-allowed}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:.85rem;margin:14px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.req{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.msg{padding:12px 16px;border-radius:10px;background:rgba(234,185,107,.15);border:1px solid var(--gold);margin:12px 0}
details summary{cursor:pointer;color:var(--gold);font-weight:700;margin-top:16px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:0 16px 40px}
@media(max-width:620px){.ticket{grid-template-columns:1fr}.poster{max-width:160px}.card{padding:18px}}

.adminbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:var(--gold);color:#2a0a10;padding:8px;font-weight:700}
.adminbar .btn{padding:6px 14px;font-size:.9rem}
.ed{outline:1px dashed var(--gold);outline-offset:3px;border-radius:4px;min-height:1em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{max-width:360px;width:100%;margin:0}
.x{float:right;padding:4px 12px}
footer a{color:var(--mut)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:18px 0}
.gal figure{margin:0}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
.gal figcaption{font-size:.8rem;color:var(--mut);margin-top:4px}
.poster img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.day.pend{border-style:dashed;border-color:var(--gold)}
.day.priv{background:var(--gold);border-color:var(--gold);color:#2a0a10;cursor:not-allowed}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stats div{flex:1;min-width:110px;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--mut);font-size:.85rem}
.stats b{display:block;font:800 1.8rem "Playfair Display",serif;color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.bulbs{animation:fl 3s infinite}@keyframes fl{0%,100%{opacity:.85}45%{opacity:.5}50%{opacity:1}}
.fade{animation:fi .5s}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:grid;place-items:center}.lb img{max-width:92vw;max-height:88vh;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const nice=k=>new Date(k+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let S=JSON.parse($('#state').textContent),adm=false,edit=false,login=false,msg='',sel=null,req=null,view=new Date();
view.setDate(1);
try{adm=sessionStorage.getItem('hk')==='1'}catch(e){}
try{const th=localStorage.getItem('hkt');if(th)document.documentElement.dataset.theme=th}catch(e){}
S={films:[],gallery:[],wishes:[],guests:[],kind:{},wa:'',fav:{t:'⭐ Film des Monats',x:'Hier stellst du deinen aktuellen Lieblingsfilm vor.'},...S};
let lb=null,poster='',nav=false;
const get=p=>p.split('.').reduce((o,k)=>o?.[k],S);
const put=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const E=(tag,p,st='')=>`<${tag} ${st?`style="${st}" `:''}${edit?`data-e="${p}" contenteditable="true" class="ed"`:''}>${esc(get(p))}</${tag}>`;
const collect=()=>document.querySelectorAll('[data-e]').forEach(el=>put(el.dataset.e,el.innerText.trim()));
const rm=(l,i)=>edit?`<button class="btn ghost x" data-a="del" data-l="${l}" data-i="${i}">✕</button>`:'';
const addb=l=>edit?`<p><button class="btn ghost" data-a="add" data-l="${l}">＋ Hinzufügen</button></p>`:'';
const curPage=()=>{const p=(location.hash||'#start').slice(1);return ['start','idee','kalender','infos'].includes(p)||(p==='admin'&&adm)?p:'start'};
const count=n=>{if(!n.date)return'';const d=Math.ceil((new Date(n.date+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);return d>1?`<span class="count">in ${d} Tagen</span>`:d===1?'<span class="count">Morgen!</span>':d===0?'<span class="count">Heute Abend!</span>':''};
const inp=(id,l,v,t='text')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}">`;
const v=id=>document.getElementById(id)?.value.trim()||'';

const prog=()=>{const t=key(new Date()),up=S.films.filter(f=>f.date>=t).sort((a,b)=>a.date.localeCompare(b.date)),old=S.films.filter(f=>f.date<t).sort((a,b)=>b.date.localeCompare(a.date)),nb=Object.keys(S.booked).filter(k=>k<t).length;
const row=f=>`<div class="row"><div><b>${esc(f.title)}</b> <span class="tag">${esc(f.type)}</span><br><span style="color:var(--mut)">${esc(f.text)}</span></div><div class="meta" style="margin:0;white-space:nowrap">${esc(new Date(f.date+'T12:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}))}</div></div>`;
return `<div class="stats"><div><b>${old.length}</b>Filme gezeigt</div><div><b>${nb}</b>Kinoabende</div><div><b>${up.length}</b>Weitere Termine</div></div>
<div class="card">${E('h3','fav.t')}${E('p','fav.x','margin:0')}</div>
${up.length?`<div class="card"><h3>Kommendes Programm</h3>${up.map(row).join('')}</div>`:''}${old.length?`<div class="card"><h3>🎞️ Filmarchiv</h3>${old.map(row).join('')}</div>`:''}`};
const gal=()=>`<h2 style="margin-top:36px">Bilder</h2>${S.gallery.length?`<div class="gal">${S.gallery.map((g,i)=>`<figure><img src="${g.src}" alt="${esc(g.c)}" data-a="zoom" data-i="${i}">${edit?`<button class="btn ghost" data-a="gdel" data-i="${i}">✕ Löschen</button>`:''}${E('figcaption','gallery.'+i+'.c')}</figure>`).join('')}</div>`:'<p style="color:var(--mut)">Noch keine Bilder.</p>'}${edit?'<label>Fotos hinzufügen</label><input type="file" accept="image/*" multiple id="gFile">':''}`;
const extra=()=>`${S.wishes.length?`<div class="card" style="margin-top:20px"><h3>🎞️ Wunschliste</h3><p style="color:var(--mut)">Diese Filme stehen auf der Liste. Eigene Wünsche schreibst du einfach in deine Anfrage.</p>${S.wishes.map(w=>`<div class="row">${esc(w)}</div>`).join('')}</div>`:''}${S.guests.length?`<div class="card" style="margin-top:20px"><h3>📖 Gästebuch</h3>${S.guests.map(g=>`<blockquote style="margin:12px 0;padding-left:14px;border-left:3px solid var(--red)">${esc(g.x)}<br><b style="color:var(--gold)">– ${esc(g.n)}</b></blockquote>`).join('')}</div>`:''}`;
const shrink=(f,m)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.78))};i.src=fr.result};fr.readAsDataURL(f)});
const P={
start:()=>{const n=S.next;return `<div class="eyebrow">Als Nächstes bei uns</div>

<h1 style="margin-top:12px">${esc(n.title||'Programm folgt bald')}</h1>
<div class="meta">${n.date?esc(nice(n.date))+(n.time?' · '+esc(n.time)+' Uhr':''):''}</div>
<p>${esc(n.text||'Hier siehst du immer, welcher Film oder welches Projekt als Nächstes über die Leinwand läuft. Schau bald wieder vorbei!')}</p>
${count(n)}<p style="margin-top:18px"><a class="btn" href="#kalender">Platz anfragen</a>${n.date?' <button class="btn ghost" data-a="ics" data-id="next">📅 In meinen Kalender</button>':''}</p></div></div>
<div class="card" style="margin-top:20px;text-align:center">${E('h3','intro.t')}${E('p','intro.x','margin:0')}</div>${prog()}`},
idee:()=>`<div class="eyebrow">Hinter den Kulissen</div>${E('h1','idee.t')}${E('p','idee.lead')}
<div class="tl">${S.idee.items.map((it,i)=>`<section>${rm('idee.items',i)}${E('h3','idee.items.'+i+'.t')}${E('p','idee.items.'+i+'.x')}</section>`).join('')}</div>${addb('idee.items')}${gal()}`,
infos:()=>`<div class="eyebrow">Gut zu wissen</div><h1>Infos &amp; Sonstiges</h1>
<div class="grid">${S.infos.map((it,i)=>`<div class="card">${rm('infos',i)}${E('h3','infos.'+i+'.t')}${E('p','infos.'+i+'.x')}</div>`).join('')}</div>${addb('infos')}${extra()}`,
kalender:()=>{const first=(view.getDay()+6)%7,len=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(),today=key(new Date());
let h='';for(let i=0;i<first;i++)h+='<div class="day empty"></div>';
for(let d=1;d<=len;d++){const k=key(new Date(view.getFullYear(),view.getMonth(),d)),b=S.booked[k],past=k<today;
h+=`<button class="day ${past?'past':''} ${b?(S.kind[k]?'priv':'booked'):''} ${!b&&S.pending.some(r=>r.date===k)?'pend':''} ${k===today?'today':''} ${k===sel?'sel':''}" data-k="${k}" ${past||b?'aria-disabled="true"':''}>${d}${b?`<small>${esc(adm?b:S.kind[k]?'Privat':'Belegt')}</small>`:S.pending.some(r=>r.date===k)?'<small>Angefragt</small>':''}</button>`}
const f=req?`<div class="card"><div class="ticket" style="grid-template-columns:1fr;text-align:center;margin-bottom:16px"><div><span class="tag">Eintrittskarte</span><h2 style="margin:8px 0">${esc(S.title)}</h2><div class="meta">${esc(nice(req.date))}</div><div>${esc(req.name)} · ${esc(req.g)} Pers.</div></div></div><h3>Fast geschafft! 🎟️</h3><p>Schick diese Nachricht ab – ich melde mich bei dir. Der Tag erscheint hier als belegt, sobald ich bestätigt habe.</p>
${req.mail?`<p><a class="btn" href="${esc(req.mail)}" target="_blank" rel="noopener">E-Mail-App öffnen</a></p>`:'<p>Schick sie mir über den gewohnten Weg (siehe Infos → Kontakt).</p>'}
${req.wa?`<p><a class="btn" href="${esc(req.wa)}" target="_blank" rel="noopener">WhatsApp öffnen</a></p>`:''}<p><button class="btn ghost" data-a="ics" data-id="req">📅 Termin vormerken (.ics)</button></p><textarea id="rBody" rows="5" readonly>${esc(req.body)}</textarea><button class="btn ghost" data-a="copy">Text kopieren</button></div>`
:sel?`<div class="card"><h3>Anfrage für ${esc(nice(sel))}</h3>${inp('fName','Dein Name','')}${inp('fGuests','Anzahl Personen','2','number')}
<label>Wunschfilm oder Nachricht (optional)</label><textarea id="fNote" rows="3" maxlength="400"></textarea><button class="btn" data-a="send">Anfrage vorbereiten</button></div>`:'';
return `<div class="eyebrow">Reservierung</div><h1>Kalender</h1><p>Wähle einen freien Tag und schick mir deine Anfrage. Bestätigte Tage erscheinen hier als belegt.</p>
<div class="card"><div class="cal-head"><button class="btn ghost" data-a="pm" aria-label="Voriger Monat">‹</button><h2>${MON[view.getMonth()]} ${view.getFullYear()}</h2><button class="btn ghost" data-a="nm" aria-label="Nächster Monat">›</button></div>
<div class="dow"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div><div class="days">${h}</div>
<div class="legend"><span><i style="background:var(--surf);border:1px solid var(--line)"></i>Frei</span><span><i style="background:var(--red)"></i>Belegt</span><span><i style="background:var(--gold)"></i>Privatvorstellung</span><span><i style="border:1px dashed var(--gold)"></i>Angefragt</span><span><i style="border:1px solid var(--gold)"></i>Heute</span></div></div>${f}`},
admin:()=>{const n=S.next,bk=Object.keys(S.booked).sort();return `<div class="eyebrow">Verwaltung</div><h1>Admin</h1>
<div class="card"><h3>Nächster Film / Projekt</h3>${inp('aType','Art',n.type)}${inp('aTitle','Titel',n.title)}${inp('aDate','Datum',n.date,'date')}${inp('aTime','Uhrzeit',n.time,'time')}
<label>Beschreibung</label><textarea id="aText" rows="3">${esc(n.text)}</textarea><label>Plakat (Bild)</label><input type="file" accept="image/*" id="pFile"><button class="btn" data-a="film">Veröffentlichen</button></div>
<div class="card"><h3>Anfragen</h3><p style="color:var(--mut)">Anfragen kommen per E-Mail. Trag sie hier ein, um sie anzunehmen oder abzulehnen – oder belege einen Tag direkt. Namen sind im Seitenquelltext sichtbar, am besten nur Vornamen verwenden.</p>
${inp('rDate','Datum','','date')}${inp('rName','Name','')}<label><input type="checkbox" id="rPriv" style="width:auto;margin:0 8px 0 0">Privatvorstellung (nur bei „Direkt belegen“)</label><br><button class="btn" data-a="addreq">Als Anfrage erfassen</button> <button class="btn ghost" data-a="addbook">Direkt belegen</button>
${S.pending.map(r=>`<div class="req"><div><b>${esc(nice(r.date))}</b><br>${esc(r.name)}</div><div><button class="btn" data-a="ok" data-id="${esc(r.id)}">Annehmen</button> <button class="btn ghost" data-a="no" data-id="${esc(r.id)}">Ablehnen</button></div></div>`).join('')}</div>
<div class="card"><h3>Belegte Tage</h3>${bk.length?bk.map(k=>`<div class="req"><div><b>${esc(nice(k))}</b><br>${esc(S.booked[k])}</div><button class="btn ghost" data-a="free" data-id="${k}">Freigeben</button></div>`).join(''):'<p style="color:var(--mut)">Noch nichts belegt.</p>'}</div>
<div class="card"><h3>Programm &amp; Archiv</h3>${inp('mType','Art','Film')}${inp('mTitle','Titel','')}${inp('mDate','Datum','','date')}${inp('mText','Kurzbeschreibung','')}<button class="btn" data-a="addfilm">Hinzufügen</button>${S.films.map((f,i)=>`<div class="req"><div><b>${esc(f.title)}</b> · ${esc(f.date)}</div><button class="btn ghost" data-a="delfilm" data-i="${i}">Löschen</button></div>`).join('')}</div>
<div class="card"><h3>Wunschliste &amp; Gästebuch</h3>${inp('wTitle','Wunschfilm','')}<button class="btn" data-a="addwish">Zur Wunschliste</button>${S.wishes.map((w,i)=>`<div class="req"><div>${esc(w)}</div><button class="btn ghost" data-a="delwish" data-i="${i}">✕</button></div>`).join('')}
${inp('gName','Gast','')}<label>Eintrag</label><textarea id="gText" rows="2"></textarea><button class="btn" data-a="addguest">Ins Gästebuch</button>${S.guests.map((g,i)=>`<div class="req"><div><b>${esc(g.n)}</b>: ${esc(g.x)}</div><button class="btn ghost" data-a="delguest" data-i="${i}">✕</button></div>`).join('')}</div>
<div class="card"><h3>Einstellungen</h3>${inp('sMail','E-Mail für Anfragen',S.email,'email')}${inp('sWa','WhatsApp-Nummer (z. B. 491701234567)',S.wa)}${inp('sUser','Benutzername',S.auth.u)}
<label>Neues Passwort (leer = unverändert)</label><input id="sPw" type="password" autocomplete="new-password"><button class="btn" data-a="settings">Speichern</button></div>`}};

function render(){
 document.title=S.title||'Heimkino';
 const p=curPage(),pg=[['start','Programm'],['idee','Die Idee'],['kalender','Kalender'],['infos','Infos']].concat(adm?[['admin','⚙ Admin']]:[]);
 $('#app').innerHTML=`${adm?`<div class="adminbar">🔧 Admin ${edit?'<button class="btn" data-a="save">💾 Speichern</button>':''}<button class="btn ghost" data-a="edit">${edit?'Bearbeiten beenden':'Texte bearbeiten'}</button><button class="btn ghost" data-a="out">Abmelden</button></div>`:''}
<header><div class="logo">${E('span','title')}${E('small','sub')}</div><div class="bulbs"></div></header>
<nav>${pg.map(([k,l])=>`<a href="#${k}" class="${k===p?'on':''}">${l}</a>`).join('')}</nav>
<main class="${nav?'fade':''}">${msg&&!login?`<div class="msg">${esc(msg)}</div>`:''}${P[p]()}</main>
<footer>${esc(S.title)} · Mit Liebe zum Film gebaut 🎞️ · <a href="#" data-a="theme">🌓 Hell/Dunkel</a> · <a href="#" data-a="login">Admin</a></footer>
${lb!==null&&S.gallery[lb]?`<div class="lb" data-a="lbx"><img src="${S.gallery[lb].src}" alt=""></div>`:''}${login?`<div class="modal"><div class="card"><h3>Admin-Login</h3>${msg?`<p>${esc(msg)}</p>`:''}${inp('lu','Benutzername','')}<label>Passwort</label><input id="lp" type="password"><button class="btn" data-a="dologin">Anmelden</button> <button class="btn ghost" data-a="cancel">Abbrechen</button></div></div>`:''}`;
}
async function commit(){
 if(edit)collect();
 const c=document.documentElement.cloneNode(true);
 c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 c.querySelector('#app').innerHTML='';c.removeAttribute('data-theme');
 try{const a=window.claude&&await claude.use('artifact');
  if(!a){msg='Speichern geht nur, wenn du die Seite in deinem claude.ai-Konto öffnest.';return render()}
  await a.publish('<!doctype html>\n'+c.outerHTML);msg='Gespeichert ✓'}
 catch(e){msg=e&&(e.code==='not_writer'||e.code==='not_granted')?'Speichern geht nur, wenn du die Seite in deinem claude.ai-Konto öffnest.':'Speichern hat nicht geklappt.'}
 render();
}
$('#app').addEventListener('change',async e=>{const t=e.target;
 if(t.id==='pFile'&&t.files[0]){poster=await shrink(t.files[0],600);t.insertAdjacentHTML('afterend','<p>✓ Plakat bereit – jetzt „Veröffentlichen“ klicken.</p>')}
 if(t.id==='gFile'){collect();for(const f of t.files)S.gallery.push({src:await shrink(f,900),c:''});render()}});
$('#app').addEventListener('click',async e=>{
 const t=e.target.closest('[data-a],[data-k]');if(!t)return;const d=t.dataset,a=d.a;
 if(d.k){if(t.getAttribute('aria-disabled'))return;sel=d.k;req=null;return render()}
 e.preventDefault();
 if(a==='pm'||a==='nm'){view.setMonth(view.getMonth()+(a==='pm'?-1:1));return render()}
 if(a==='send'){const n=v('fName');if(!n){msg='Bitte gib deinen Namen an.';return render()}msg='';
  const body=`Hallo! Ich würde gern am ${nice(sel)} das Kino nutzen.\nName: ${n}\nPersonen: ${v('fGuests')||1}${v('fNote')?'\nNachricht: '+v('fNote'):''}`;
  req={date:sel,name:n,g:v('fGuests')||1,body,wa:S.wa?'https://wa.me/'+S.wa.replace(/\D/g,'')+'?text='+encodeURIComponent(body):'',mail:S.email?`mailto:${S.email}?subject=${encodeURIComponent('Kinoanfrage '+sel)}&body=${encodeURIComponent(body)}`:''};return render()}
 if(a==='copy'){try{await navigator.clipboard.writeText(req.body);msg='Kopiert ✓'}catch(x){$('#rBody').select();msg='Text markiert – bitte kopieren.'}return render()}
 if(a==='theme'){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),n=cur==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('hkt',n)}catch(x){}return}
 if(a==='zoom'){lb=+d.i;return render()}
 if(a==='lbx'){lb=null;return render()}
 if(a==='gdel'){collect();S.gallery.splice(+d.i,1);return render()}
 if(a==='addfilm'){const t=v('mTitle'),dt=v('mDate');if(!t||!dt){msg='Titel und Datum fehlen.';return render()}S.films.push({type:v('mType')||'Film',title:t,date:dt,text:v('mText')});return commit()}
 if(a==='delfilm'){S.films.splice(+d.i,1);return commit()}
 if(a==='addwish'){if(v('wTitle'))S.wishes.push(v('wTitle'));return commit()}
 if(a==='delwish'){S.wishes.splice(+d.i,1);return commit()}
 if(a==='addguest'){if(v('gName')&&v('gText'))S.guests.push({n:v('gName'),x:v('gText')});return commit()}
 if(a==='delguest'){S.guests.splice(+d.i,1);return commit()}
 if(a==='ics'){const x=d.id==='next'?S.next:{title:'Kinoabend',date:req.date,time:'19:00'},z=n=>String(n).padStart(2,'0'),[h,m]=(x.time||'19:00').split(':'),D=x.date.replace(/-/g,'');
  const s=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Heimkino//DE','BEGIN:VEVENT','UID:'+D+h+m+'@heimkino','DTSTAMP:'+D+'T000000','DTSTART:'+D+'T'+h+m+'00','DTEND:'+D+'T'+z(Math.min(23,+h+3))+m+'00','SUMMARY:'+S.title+' – '+(x.title||'Kinoabend'),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  try{const dl=window.claude&&await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:'kinoabend.ics',data:s});msg='Termin gespeichert ✓'}catch(x){msg='Der Kalender-Download ist hier leider nicht möglich.'}return render()}
 if(a==='login'){login=true;msg='';return render()}
 if(a==='cancel'){login=false;msg='';return render()}
 if(a==='dologin'){const u=v('lu'),h=await sha(u+':'+$('#lp').value);
  if(u===S.auth.u&&h===S.auth.h){adm=true;login=false;msg='';try{sessionStorage.setItem('hk','1')}catch(x){}location.hash='#admin';return render()}
  msg='Benutzername oder Passwort falsch.';return render()}
 if(a==='out'){adm=false;edit=false;try{sessionStorage.removeItem('hk')}catch(x){}location.hash='#start';return render()}
 if(a==='edit'){if(edit)collect();edit=!edit;return render()}
 if(a==='save')return commit();
 if(a==='add'||a==='del'){collect();const L=get(d.l);a==='add'?L.push({t:'Neuer Titel',x:'Text hier eingeben.'}):L.splice(+d.i,1);return render()}
 if(a==='film'){S.next={type:v('aType')||'Film',title:v('aTitle'),date:v('aDate'),time:v('aTime'),text:v('aText'),poster:poster||S.next.poster||''};poster='';return commit()}
 if(a==='addreq'||a==='addbook'){const dt=v('rDate'),nm=v('rName');if(!dt||!nm){msg='Bitte Datum und Namen eintragen.';return render()}
  if(S.booked[dt]){msg='Dieser Tag ist schon belegt.';return render()}
  a==='addbook'?(S.booked[dt]=nm,$('#rPriv').checked?S.kind[dt]='privat':delete S.kind[dt]):S.pending.push({id:Date.now().toString(36),date:dt,name:nm});return commit()}
 if(a==='ok'){const r=S.pending.find(x=>x.id===d.id);if(!r)return;if(S.booked[r.date]){msg='Dieser Tag ist schon belegt.';return render()}
  S.booked[r.date]=r.name;S.pending=S.pending.filter(x=>x.id!==d.id);return commit()}
 if(a==='no'){S.pending=S.pending.filter(x=>x.id!==d.id);return commit()}
 if(a==='free'){delete S.booked[d.id];delete S.kind[d.id];return commit()}
 if(a==='settings'){S.email=v('sMail');S.wa=v('sWa');const u=v('sUser'),pw=$('#sPw').value;
  if(u&&(pw||u!==S.auth.u)){if(!pw){msg='Bei geändertem Benutzernamen bitte auch ein neues Passwort setzen.';return render()}S.auth={u,h:await sha(u+':'+pw)}}
  else if(pw)S.auth.h=await sha(S.auth.u+':'+pw);
  return commit()}
});
addEventListener('hashchange',()=>{if(edit)collect();msg='';nav=true;render();nav=false;scrollTo(0,0)});
render();
</script>


</body></html>
